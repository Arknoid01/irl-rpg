<!DOCTYPE html>
<html lang="fr" data-theme="cyberpunk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>IRL RPG — Ton compagnon d'aventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Almendra+SC&family=Eczar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --radius: 6px;
}

/* ============ THEME: CYBERPUNK ============ */
[data-theme="cyberpunk"]{
  --bg: #060a10;
  --bg-grad: radial-gradient(ellipse at 20% -10%, #0e2230 0%, #060a10 55%);
  --panel: #0a121c;
  --panel2: #0c1620;
  --border: #1c3a4a;
  --text: #d8f4ff;
  --text-dim: #6f93a3;
  --accent: #ff2e9a;
  --accent2: #00e5ff;
  --gold: #f4d35e;
  --danger: #ff4d5e;
  --font-display: 'Orbitron', sans-serif;
  --font-body: 'Share Tech Mono', monospace;
  --letter: 0.02em;
  --panel-radius: 2px;
}

/* ============ THEME: SKYRIM ============ */
[data-theme="skyrim"]{
  --bg: #14120f;
  --bg-grad: radial-gradient(ellipse at 50% -20%, #2a2318 0%, #14120f 60%);
  --panel: #1e1a14;
  --panel2: #241f18;
  --border: #6a5730;
  --text: #ecdfc0;
  --text-dim: #a9977a;
  --accent: #7a9bb0;
  --accent2: #c9a227;
  --gold: #c9a227;
  --danger: #8a2f22;
  --font-display: 'Cinzel', serif;
  --font-body: 'EB Garamond', serif;
  --letter: 0.01em;
  --panel-radius: 3px;
}

/* ============ THEME: WITCHER ============ */
[data-theme="witcher"]{
  --bg: #100d0c;
  --bg-grad: radial-gradient(ellipse at 50% -10%, #211613 0%, #100d0c 60%);
  --panel: #17110f;
  --panel2: #1c1512;
  --border: #4a4038;
  --text: #d9cdb8;
  --text-dim: #93857a;
  --accent: #7a1f1f;
  --accent2: #b8bcc2;
  --gold: #b8923f;
  --danger: #9c2a2a;
  --font-display: 'Almendra SC', serif;
  --font-body: 'Eczar', serif;
  --letter: 0.015em;
  --panel-radius: 1px;
}

*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin:0; padding:0;}
body{
  background: var(--bg-grad), var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
  padding-bottom: 90px;
  transition: background 0.4s ease, color 0.4s ease;
}
::selection{ background: var(--accent); color: var(--bg); }

.wrap{ max-width: 480px; margin: 0 auto; padding: 16px 14px 0; }

/* ---------- Top bar / theme switcher ---------- */
.topbar{
  display:flex; align-items:center; justify-content: space-between;
  padding: 10px 2px 14px;
}
.brand{
  font-family: var(--font-display);
  font-size: 15px;
  letter-spacing: var(--letter);
  color: var(--text);
  display:flex; align-items:center; gap:8px;
}
.brand .glyph{ color: var(--accent2); font-size: 18px; }
.theme-picker{ display:flex; gap:6px; }
.theme-dot{
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--border);
  cursor: pointer;
  background: #222;
  opacity: 0.55;
  transition: opacity 0.2s, transform 0.2s;
  padding:0;
}
.theme-dot:hover{ transform: translateY(-1px); }
.theme-dot.active{ opacity: 1; border-color: var(--accent2); }
.theme-dot[data-t="cyberpunk"]{ background: linear-gradient(135deg,#ff2e9a,#00e5ff); }
.theme-dot[data-t="skyrim"]{ background: linear-gradient(135deg,#c9a227,#3f5468); }
.theme-dot[data-t="witcher"]{ background: linear-gradient(135deg,#7a1f1f,#b8bcc2); }

/* ---------- Panel base, reskinned per theme ---------- */
.panel{
  position: relative;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--panel-radius);
  padding: 16px;
  margin-bottom: 14px;
}
[data-theme="cyberpunk"] .panel{
  clip-path: polygon(0 10px, 10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
  background-image:
    repeating-linear-gradient(180deg, rgba(0,229,255,0.03) 0px, rgba(0,229,255,0.03) 1px, transparent 1px, transparent 3px),
    linear-gradient(180deg, var(--panel), var(--panel2));
  box-shadow: 0 0 0 1px rgba(0,229,255,0.08), 0 0 18px -6px rgba(255,46,154,0.25);
}
[data-theme="skyrim"] .panel{
  background: linear-gradient(180deg, var(--panel), var(--panel2));
  box-shadow: inset 0 0 0 1px rgba(201,162,39,0.12), 0 6px 16px -8px rgba(0,0,0,0.6);
  border-width: 2px;
}
[data-theme="skyrim"] .panel::before{
  content:""; position:absolute; left:14px; right:14px; top:8px; height:1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity:0.5;
}
[data-theme="witcher"] .panel{
  background: linear-gradient(180deg, var(--panel), var(--panel2));
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%);
  box-shadow: inset 0 0 0 1px rgba(184,188,194,0.06), 0 8px 18px -10px rgba(0,0,0,0.7);
}

.panel-title{
  font-family: var(--font-display);
  font-size: 12px;
  letter-spacing: var(--letter);
  color: var(--text-dim);
  margin: 0 0 12px;
  display:flex; align-items:center; gap:6px;
}
[data-theme="cyberpunk"] .panel-title{ color: var(--accent2); text-transform: uppercase; font-size: 11px; }
[data-theme="skyrim"] .panel-title{ color: var(--gold); font-size: 13px; }
[data-theme="witcher"] .panel-title{ color: var(--gold); font-size: 12px; }

/* ---------- Character sheet ---------- */
.char-head{ display:flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px;}
.char-name{ font-family: var(--font-display); font-size: 20px; }
.char-level{ font-size: 13px; color: var(--text-dim); }
.char-level b{ color: var(--gold); }

.bar-row{ margin: 10px 0; }
.bar-label{ display:flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
.bar-track{ height: 8px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow:hidden; }
.bar-fill{ height: 100%; border-radius: 4px; transition: width 0.5s ease; }
.bar-fill.xp{ background: linear-gradient(90deg, var(--accent2), var(--gold)); }
.bar-fill.energy{ background: linear-gradient(90deg, var(--accent), var(--accent2)); }

.streak-row{ display:flex; align-items:center; gap:6px; font-size: 12px; color: var(--text-dim); margin-top: 8px; }
.streak-row b{ color: var(--gold); }

.skills-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-top: 14px; }
.skill-item{ font-size: 12px; }
.skill-top{ display:flex; justify-content: space-between; margin-bottom: 3px; color: var(--text-dim); }
.skill-top span:first-child{ color: var(--text); }
.skill-bar{ height: 5px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow:hidden; }
.skill-bar i{ display:block; height:100%; background: var(--accent2); }

.titles-row{ margin-top: 12px; display:flex; flex-wrap: wrap; gap: 6px; }
.title-chip{
  font-size: 10.5px; padding: 3px 8px; border-radius: 20px;
  border: 1px solid var(--border); color: var(--gold);
  letter-spacing: var(--letter);
}

/* ---------- Quest cards ---------- */
.section-label{
  font-family: var(--font-display);
  font-size: 12px; letter-spacing: var(--letter);
  color: var(--text-dim); margin: 18px 4px 8px;
  display:flex; align-items:center; justify-content: space-between;
}
[data-theme="cyberpunk"] .section-label{ text-transform: uppercase; color: var(--accent2); font-size: 11px;}
[data-theme="skyrim"] .section-label,[data-theme="witcher"] .section-label{ color: var(--gold); font-size: 13px; }

.refresh-btn{
  background: none; border: 1px solid var(--border); color: var(--text-dim);
  font-family: var(--font-body); font-size: 11px; padding: 4px 9px; border-radius: 20px;
  cursor: pointer;
}
.refresh-btn:hover{ color: var(--text); border-color: var(--accent2); }

.quest-card{
  background: var(--panel2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--cat-color, var(--accent2));
  border-radius: var(--panel-radius);
  padding: 12px 13px;
  margin-bottom: 10px;
  transition: transform 0.15s ease, opacity 0.3s ease;
}
.quest-card.removing{ opacity: 0; transform: translateX(30px); }
.quest-card.special{ border-left-color: var(--danger); }
.quest-top{ display:flex; justify-content: space-between; align-items:flex-start; gap:8px; margin-bottom: 6px;}
.quest-cat{ font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display:flex; align-items:center; gap:5px;}
.quest-xp{ font-size: 11px; color: var(--gold); font-family: var(--font-display); white-space: nowrap; }
.quest-text{ font-size: 14.5px; line-height: 1.45; margin-bottom: 10px; }
.quest-text.hidden-text{ color: var(--text-dim); font-style: italic; }
.quest-tag{
  display:inline-block; font-size: 9.5px; padding: 2px 7px; border-radius: 10px;
  border: 1px solid var(--danger); color: var(--danger); margin-bottom: 8px; letter-spacing: 0.04em;
}
.quest-actions{ display:flex; gap: 8px; }
.btn{
  flex:1; text-align:center; padding: 8px 10px; border-radius: 4px; border: 1px solid var(--border);
  background: transparent; color: var(--text); font-family: var(--font-body); font-size: 12.5px;
  cursor: pointer; letter-spacing: var(--letter);
}
.btn:active{ transform: scale(0.97); }
.btn.primary{ background: var(--accent2); color: var(--bg); border-color: var(--accent2); font-weight: 600; }
[data-theme="skyrim"] .btn.primary, [data-theme="witcher"] .btn.primary{ background: var(--gold); color: #1a1408; }
.btn.ghost{ color: var(--text-dim); }
.btn.done{ background: var(--accent); color: #fff; border-color: var(--accent); }
[data-theme="skyrim"] .btn.done, [data-theme="witcher"] .btn.done{ background: var(--danger); color: #f2e9da; border-color: var(--danger);}

.empty-state{
  text-align:center; padding: 26px 10px; color: var(--text-dim); font-size: 13px;
}
.empty-state button{ margin-top: 12px; }

/* ---------- Event banner ---------- */
.event-panel{
  border-color: var(--danger) !important;
  position: relative;
}
.event-badge{
  font-family: var(--font-display); font-size: 10px; letter-spacing: 0.08em;
  color: var(--danger); text-transform: uppercase; margin-bottom: 6px; display:block;
}

/* ---------- Journal ---------- */
.journal-entry{
  border-left: 2px solid var(--border); padding: 4px 0 4px 12px; margin-bottom: 12px; font-size: 13px; line-height:1.5;
}
.journal-date{ font-size: 10px; color: var(--text-dim); display:block; margin-bottom:2px; }

/* ---------- Toast ---------- */
#toast{
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px);
  background: var(--panel); border: 1px solid var(--accent2); color: var(--text);
  padding: 10px 18px; border-radius: 20px; font-size: 13px; font-family: var(--font-body);
  opacity: 0; pointer-events: none; transition: all 0.35s ease; z-index: 50; white-space: nowrap;
}
#toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- Nav tabs ---------- */
.tabs{
  position: fixed; bottom: 0; left: 0; right: 0;
  display:flex; background: var(--panel); border-top: 1px solid var(--border);
  max-width: 480px; margin: 0 auto;
}
.tab{
  flex:1; text-align:center; padding: 12px 6px 10px; background:none; border:none;
  color: var(--text-dim); font-family: var(--font-body); font-size: 11px; cursor: pointer;
  letter-spacing: var(--letter);
}
.tab .ic{ display:block; font-size:16px; margin-bottom:2px; }
.tab.active{ color: var(--accent2); }
[data-theme="skyrim"] .tab.active, [data-theme="witcher"] .tab.active{ color: var(--gold); }

.view{ display:none; }
.view.active{ display:block; }

.companion-line{
  font-size: 12.5px; color: var(--text-dim); font-style: italic; margin: -4px 4px 14px;
  border-left: 2px solid var(--border); padding-left: 10px;
}
</style>
</head>
<body data-theme="cyberpunk">
<div class="wrap">

  <div class="topbar">
    <div class="brand"><span class="glyph">◆</span><span id="brandLabel">IRL RPG</span></div>
    <div class="theme-picker">
      <button class="theme-dot" data-t="cyberpunk" title="Cyberpunk"></button>
      <button class="theme-dot" data-t="skyrim" title="Skyrim"></button>
      <button class="theme-dot" data-t="witcher" title="Witcher"></button>
    </div>
  </div>

  <p class="companion-line" id="companionLine"></p>

  <!-- ===== VIEW: HOME ===== -->
  <div class="view active" id="view-home">

    <div class="panel">
      <div class="char-head">
        <div class="char-name" id="charName">Yannick</div>
        <div class="char-level">Niveau <b id="lvlVal">1</b></div>
      </div>

      <div class="bar-row">
        <div class="bar-label"><span>XP</span><span id="xpLabel">0 / 200</span></div>
        <div class="bar-track"><div class="bar-fill xp" id="xpBar" style="width:0%"></div></div>
      </div>

      <div class="bar-row">
        <div class="bar-label"><span>Énergie du jour</span><span id="enLabel">0%</span></div>
        <div class="bar-track"><div class="bar-fill energy" id="enBar" style="width:0%"></div></div>
      </div>

      <div class="streak-row">🔥 Série : <b id="streakVal">0</b> jour(s)</div>

      <div class="skills-grid" id="skillsGrid"></div>

      <div class="titles-row" id="titlesRow"></div>
    </div>

    <div class="section-label">
      <span>Quêtes du jour</span>
      <button class="refresh-btn" id="refreshBtn">↻ Nouvelle journée</button>
    </div>
    <div id="questList"></div>

    <div id="eventSlot"></div>

  </div>

  <!-- ===== VIEW: JOURNAL ===== -->
  <div class="view" id="view-journal">
    <div class="section-label"><span>Journal d'aventure</span></div>
    <div id="journalList"></div>
  </div>

</div>

<div id="toast"></div>

<div class="tabs">
  <button class="tab active" data-view="home"><span class="ic">⚔</span>Aventure</button>
  <button class="tab" data-view="journal"><span class="ic">📖</span>Journal</button>
</div>

<script>
/* =========================================================
   DATA
========================================================= */
const THEMES = {
  cyberpunk: { name: "Cyberpunk", companion: "Ton IA compagnon scanne la ville. Nouvelles missions détectées." },
  skyrim:    { name: "Skyrim", companion: "Ton compagnon de route consulte la carte. De nouvelles quêtes t'attendent, voyageur." },
  witcher:   { name: "Witcher", companion: "Ton médaillon frémit légèrement. De nouveaux contrats sont à prendre." }
};

const CAT_META = {
  quotidien:    { label: "Quotidien",    icon: "🏠", color: "var(--accent2)" },
  exploration:  { label: "Exploration",  icon: "🌎", color: "var(--gold)" },
  social:       { label: "Social",       icon: "🤝", color: "var(--accent)" },
  intelligence: { label: "Intelligence", icon: "🧠", color: "var(--accent2)" },
  chaos:        { label: "Chaos",        icon: "😂", color: "var(--danger)" }
};

const SKILL_META = {
  curiosite:  { label: "Curiosité",  icon:"🧠" },
  social:     { label: "Social",     icon:"🤝" },
  audace:     { label: "Audace",     icon:"🧗" },
  creativite: { label: "Créativité", icon:"🎨" },
  discipline: { label: "Discipline", icon:"🧹" },
  chaos:      { label: "Chaos",      icon:"😂" }
};

const TITLES = [
  { id:"explorateur", skill:"audace",     min:250, label:"🥾 Explorateur" },
  { id:"diplomate",   skill:"social",     min:250, label:"🤝 Diplomate" },
  { id:"erudit",      skill:"curiosite",  min:250, label:"🧠 Érudit" },
  { id:"chaos",       skill:"chaos",      min:250, label:"😂 Agent du Chaos" },
  { id:"heros",       skill:"discipline", min:250, label:"🏆 Héros du quotidien" },
  { id:"artiste",     skill:"creativite", min:250, label:"🎨 Artiste de rue" }
];

// Quest bank — volontairement chargé côté social, comme demandé.
const QUESTS = [
  // ---- SOCIAL (priorité) ----
  { id:"s1", cat:"social", text:"Fais un compliment sincère à un inconnu dans la rue.", xp:150, skill:"social" },
  { id:"s2", cat:"social", text:"Mets aujourd'hui un vêtement que tu adores mais que tu ne portes presque jamais.", xp:80, skill:"social" },
  { id:"s3", cat:"social", text:"Envoie un message à quelqu'un à qui tu n'as pas parlé depuis longtemps.", xp:120, skill:"social" },
  { id:"s4", cat:"social", text:"Engage la conversation avec quelqu'un que tu ne connais pas encore.", xp:150, skill:"social" },
  { id:"s5", cat:"social", text:"Remercie sincèrement quelqu'un qui t'a aidé récemment.", xp:100, skill:"social" },
  { id:"s6", cat:"social", text:"Pose une question à un inconnu (l'heure, un conseil, un chemin).", xp:90, skill:"social" },
  { id:"s7", cat:"social", text:"Appelle en vocal (pas en texto) quelqu'un que tu apprécies.", xp:130, skill:"social" },
  { id:"s8", cat:"social", text:"Propose spontanément à quelqu'un de manger ou boire un verre ensemble.", xp:140, skill:"social" },

  // ---- QUOTIDIEN ----
  { id:"q1", cat:"quotidien", text:"Range un espace qui te dérange depuis un moment.", xp:50, skill:"discipline" },
  { id:"q2", cat:"quotidien", text:"Cuisine quelque chose que tu n'as jamais essayé.", xp:80, skill:"creativite" },
  { id:"q3", cat:"quotidien", text:"Termine une petite tâche que tu repousses depuis 24h.", xp:50, skill:"discipline" },
  { id:"q4", cat:"quotidien", text:"Fais ton lit et range ta chambre avant midi.", xp:40, skill:"discipline" },

  // ---- EXPLORATION ----
  { id:"e1", cat:"exploration", text:"Prends un chemin différent pour rentrer chez toi.", xp:80, skill:"audace" },
  { id:"e2", cat:"exploration", text:"Découvre un commerce dans lequel tu n'es jamais entré.", xp:100, skill:"curiosite" },
  { id:"e3", cat:"exploration", text:"Photographie quelque chose d'étrange sur ton trajet.", xp:70, skill:"creativite" },
  { id:"e4", cat:"exploration", text:"Va dans un endroit à moins de 20 minutes que tu n'as jamais visité.", xp:120, skill:"audace" },

  // ---- INTELLIGENCE ----
  { id:"i1", cat:"intelligence", text:"Apprends quelque chose de nouveau pendant 15 minutes.", xp:70, skill:"curiosite" },
  { id:"i2", cat:"intelligence", text:"Regarde une conférence ou une vidéo qui t'apprend un vrai truc.", xp:70, skill:"curiosite" },
  { id:"i3", cat:"intelligence", text:"Résous une énigme ou un puzzle.", xp:60, skill:"curiosite" },

  // ---- CHAOS ----
  { id:"c1", cat:"chaos", text:"Lance une pièce : face, tu prends un chemin différent pour rentrer.", xp:100, skill:"chaos" },
  { id:"c2", cat:"chaos", text:"Pendant les 2 prochaines heures, réponds « probablement » à toute question.", xp:150, skill:"chaos" },
  { id:"c3", cat:"chaos", text:"Choisis un plat au hasard sur un menu, les yeux fermés.", xp:120, skill:"chaos" },

  // ---- QUÊTE CACHÉE ----
  { id:"h1", cat:"exploration", text:"Achète ou goûte quelque chose que tu n'as jamais mangé.", xp:100, skill:"curiosite",
    hidden:true,
    fragment:"Tu as choisi de goûter l'inconnu. Cette décision, en apparence anodine, laisse une trace dans ton histoire — comme si le monde retenait ce genre de choix." }
];

const EVENTS = [
  { title:"Le marchand ambulant", text:"Un événement vient d'apparaître à proximité. Tu as 45 minutes pour trouver une boulangerie que tu n'as jamais visitée.", xp:300, item:"🥖 Pain légendaire" },
  { title:"L'appel du hasard", text:"Une porte inconnue s'est ouverte. Emprunte une rue que tu n'as jamais empruntée avant la fin de la journée.", xp:250, item:"🗺️ Fragment de carte" },
  { title:"Le visage familier", text:"Quelqu'un que tu connais mal croise ton chemin aujourd'hui. Va vers lui.", xp:280, item:"🤝 Jeton de confiance" }
];

/* =========================================================
   STATE
========================================================= */
const SAVE_KEY = "irlrpg_save_v1";
let state = loadState();

function todayStr(){ return new Date().toISOString().slice(0,10); }

function defaultState(){
  return {
    name: "Yannick",
    theme: "cyberpunk",
    level: 1,
    xp: 0,
    streak: 0,
    lastPlayDate: null,
    drawDate: null,
    skills: { curiosite:0, social:0, audace:0, creativite:0, discipline:0, chaos:0 },
    titles: [],
    journal: [],
    quests: [],       // today's proposed/accepted quests: {id, status}
    event: null,      // today's random event, if any
    history: {        // for light personalization
      social: { proposed:0, skipped:0, completed:0 }
    }
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}

function saveState(){
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
}

function xpToNext(level){ return 200 + (level-1)*100; }

/* =========================================================
   QUEST DRAW LOGIC
========================================================= */
function pickRandom(arr, n, excludeIds){
  const pool = arr.filter(q => !excludeIds.includes(q.id));
  const picked = [];
  while(picked.length < n && pool.length){
    const idx = Math.floor(Math.random()*pool.length);
    picked.push(pool.splice(idx,1)[0]);
  }
  return picked;
}

function socialNeedsNudge(){
  const h = state.history.social;
  return h.proposed >= 3 && h.skipped >= 2 && h.completed === 0;
}

function drawDailyQuests(){
  const chosen = [];
  const usedIds = [];

  if(socialNeedsNudge()){
    chosen.push({
      id: "nudge_" + Date.now(),
      cat: "social",
      text: "Tu évites les interactions sociales depuis plusieurs jours. Aujourd'hui, demande simplement à quelqu'un : « Comment se passe ta journée ? »",
      xp: 250, skill:"social", special:true
    });
  } else {
    const socialPicks = pickRandom(QUESTS.filter(q=>q.cat==="social"), 2, usedIds);
    socialPicks.forEach(q=>usedIds.push(q.id));
    chosen.push(...socialPicks);
  }

  const others = QUESTS.filter(q=>q.cat!=="social" && !q.hidden);
  const otherPicks = pickRandom(others, 2, usedIds);
  otherPicks.forEach(q=>usedIds.push(q.id));
  chosen.push(...otherPicks);

  // 25% chance de glisser une quête cachée à la place d'une des "others"
  if(Math.random() < 0.25){
    const hiddenPool = QUESTS.filter(q=>q.hidden && !usedIds.includes(q.id));
    if(hiddenPool.length && chosen.length){
      const hq = hiddenPool[Math.floor(Math.random()*hiddenPool.length)];
      chosen[chosen.length-1] = hq;
    }
  }

  // Mettre à jour l'historique "proposé" pour les sociales
  chosen.filter(q=>q.cat==="social" && !q.special).forEach(()=> state.history.social.proposed++);

  state.quests = chosen.map(q => ({...q, status:"proposed"}));

  // Événement aléatoire (30% de chance)
  if(Math.random() < 0.3){
    const ev = EVENTS[Math.floor(Math.random()*EVENTS.length)];
    state.event = { ...ev, status:"active" };
  } else {
    state.event = null;
  }

  state.drawDate = todayStr();
  saveState();
}

/* =========================================================
   ACTIONS
========================================================= */
function acceptQuest(qid){
  const q = state.quests.find(x=>x.id===qid);
  if(!q) return;
  q.status = "accepted";
  saveState();
  render();
}

function ignoreQuest(qid){
  const q = state.quests.find(x=>x.id===qid);
  if(!q) return;
  q.status = "ignored";
  if(q.cat === "social" && !q.special) state.history.social.skipped++;
  saveState();
  render();
}

function completeQuest(qid){
  const q = state.quests.find(x=>x.id===qid);
  if(!q || q.status === "done") return;
  q.status = "done";

  gainXP(q.xp);
  if(q.skill) gainSkill(q.skill, Math.round(q.xp*0.6));
  if(q.cat === "social" && !q.special) state.history.social.completed++;

  if(q.fragment){
    state.journal.push({ date: todayStr(), text: q.fragment });
  }

  bumpStreak();
  checkTitles();
  saveState();
  render();
  showToast(`+${q.xp} XP`);
}

function dismissEvent(){
  state.event = null;
  saveState();
  render();
}

function completeEvent(){
  if(!state.event) return;
  const xpGained = state.event.xp;
  gainXP(xpGained);
  state.journal.push({ date: todayStr(), text: `Événement accompli — ${state.event.title}. Récompense obtenue : ${state.event.item}.` });
  state.event = null;
  bumpStreak();
  saveState();
  render();
  showToast(`+${xpGained} XP`);
}

function gainXP(amount){
  state.xp += amount;
  let need = xpToNext(state.level);
  while(state.xp >= need){
    state.xp -= need;
    state.level++;
    need = xpToNext(state.level);
    showToast(`Niveau ${state.level} atteint !`);
  }
}

function gainSkill(skill, amount){
  state.skills[skill] = (state.skills[skill]||0) + amount;
}

function bumpStreak(){
  const today = todayStr();
  if(state.lastPlayDate === today) return; // déjà comptabilisé aujourd'hui
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = y.toISOString().slice(0,10);
  if(state.lastPlayDate === yesterday){ state.streak++; }
  else { state.streak = 1; }
  state.lastPlayDate = today;
}

function checkTitles(){
  TITLES.forEach(t=>{
    if(!state.titles.includes(t.id) && (state.skills[t.skill]||0) >= t.min){
      state.titles.push(t.id);
      state.journal.push({ date: todayStr(), text: `🏆 Nouveau titre débloqué : ${t.label}` });
      showToast(`Titre débloqué : ${t.label}`);
    }
  });
}

/* =========================================================
   RENDER
========================================================= */
function render(){
  document.getElementById("charName").textContent = state.name;
  document.getElementById("lvlVal").textContent = state.level;
  const need = xpToNext(state.level);
  document.getElementById("xpLabel").textContent = `${state.xp} / ${need}`;
  document.getElementById("xpBar").style.width = Math.min(100, (state.xp/need)*100) + "%";

  const doneToday = state.quests.filter(q=>q.status==="done").length;
  const totalToday = Math.max(state.quests.length,1);
  const energyPct = Math.min(100, Math.round((doneToday/totalToday)*100));
  document.getElementById("enLabel").textContent = energyPct + "%";
  document.getElementById("enBar").style.width = energyPct + "%";

  document.getElementById("streakVal").textContent = state.streak;

  // skills
  const sg = document.getElementById("skillsGrid");
  sg.innerHTML = "";
  Object.keys(SKILL_META).forEach(k=>{
    const meta = SKILL_META[k];
    const val = state.skills[k]||0;
    const pct = Math.min(100, (val/250)*100);
    const div = document.createElement("div");
    div.className = "skill-item";
    div.innerHTML = `
      <div class="skill-top"><span>${meta.icon} ${meta.label}</span><span>${val}</span></div>
      <div class="skill-bar"><i style="width:${pct}%"></i></div>
    `;
    sg.appendChild(div);
  });

  // titles
  const tr = document.getElementById("titlesRow");
  tr.innerHTML = "";
  if(state.titles.length===0){
    tr.innerHTML = `<span style="font-size:11px;color:var(--text-dim)">Aucun titre débloqué pour l'instant.</span>`;
  } else {
    state.titles.forEach(id=>{
      const t = TITLES.find(x=>x.id===id);
      if(!t) return;
      const chip = document.createElement("span");
      chip.className = "title-chip";
      chip.textContent = t.label;
      tr.appendChild(chip);
    });
  }

  renderQuests();
  renderEvent();
  renderJournal();
  renderCompanionLine();
}

function renderQuests(){
  const list = document.getElementById("questList");
  list.innerHTML = "";

  const visible = state.quests.filter(q=>q.status!=="ignored" && q.status!=="done");
  const doneList = state.quests.filter(q=>q.status==="done");

  if(state.quests.length===0){
    list.innerHTML = `<div class="panel empty-state">Aucune quête pour aujourd'hui.<br>Ton aventure attend son premier chapitre.<br>
      <button class="btn primary" style="margin-top:12px;width:auto;display:inline-block;padding:9px 18px;" onclick="drawDailyQuests(); render();">Commencer la journée</button>
    </div>`;
    return;
  }

  if(visible.length===0 && doneList.length>0){
    list.innerHTML = `<div class="panel empty-state">Toutes les quêtes du jour sont accomplies. 🏆<br>Reviens demain pour de nouvelles aventures.</div>`;
  }

  visible.forEach(q=>{
    const meta = CAT_META[q.cat] || CAT_META.quotidien;
    const card = document.createElement("div");
    card.className = "quest-card" + (q.special ? " special" : "");
    card.style.setProperty("--cat-color", meta.color);

    let actions = "";
    if(q.status === "proposed"){
      actions = `
        <div class="quest-actions">
          <button class="btn ghost" onclick="ignoreQuest('${q.id}')">Ignorer</button>
          <button class="btn primary" onclick="acceptQuest('${q.id}')">Accepter</button>
        </div>`;
    } else if(q.status === "accepted"){
      actions = `
        <div class="quest-actions">
          <button class="btn done" onclick="completeQuest('${q.id}')">Valider ✅</button>
        </div>`;
    }

    const specialTag = q.special ? `<span class="quest-tag">⚠️ Quête personnelle</span><br>` : "";
    const questText = q.hidden ? `<span class="hidden-text">❓ Quête mystérieuse — son sens se révélera après coup.</span>` : q.text;

    card.innerHTML = `
      <div class="quest-top">
        <span class="quest-cat">${meta.icon} ${meta.label}</span>
        <span class="quest-xp">+${q.xp} XP</span>
      </div>
      ${specialTag}
      <div class="quest-text">${questText}</div>
      ${actions}
    `;
    list.appendChild(card);
  });

  if(doneList.length>0 && visible.length>0){
    const doneLabel = document.createElement("div");
    doneLabel.style.cssText = "font-size:11px;color:var(--text-dim);margin:14px 4px 6px;";
    doneLabel.textContent = `${doneList.length} quête(s) accomplie(s) aujourd'hui ✔`;
    list.appendChild(doneLabel);
  }
}

function renderEvent(){
  const slot = document.getElementById("eventSlot");
  slot.innerHTML = "";
  if(!state.event) return;
  const ev = state.event;
  const div = document.createElement("div");
  div.className = "panel event-panel";
  div.innerHTML = `
    <span class="event-badge">⚠️ Événement aléatoire</span>
    <div style="font-family:var(--font-display);font-size:14px;margin-bottom:6px;">${ev.title}</div>
    <div class="quest-text">${ev.text}</div>
    <div style="font-size:12px;color:var(--gold);margin-bottom:10px;">+${ev.xp} XP · ${ev.item}</div>
    <div class="quest-actions">
      <button class="btn ghost" onclick="dismissEvent()">❌ Ignorer</button>
      <button class="btn primary" onclick="completeEvent()">Relever le défi</button>
    </div>
  `;
  slot.appendChild(div);
}

function renderJournal(){
  const jl = document.getElementById("journalList");
  jl.innerHTML = "";
  if(state.journal.length===0){
    jl.innerHTML = `<div class="panel empty-state">Ton journal est encore vierge.<br>Chaque quête accomplie peut y laisser une trace.</div>`;
    return;
  }
  [...state.journal].reverse().forEach(entry=>{
    const div = document.createElement("div");
    div.className = "journal-entry";
    div.innerHTML = `<span class="journal-date">${entry.date}</span>${entry.text}`;
    jl.appendChild(div);
  });
}

function renderCompanionLine(){
  document.getElementById("companionLine").textContent = THEMES[state.theme].companion;
  document.getElementById("brandLabel").textContent = "IRL RPG — " + THEMES[state.theme].name;
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=> t.classList.remove("show"), 2200);
}

/* =========================================================
   THEME + NAV
========================================================= */
function setTheme(name){
  state.theme = name;
  document.body.setAttribute("data-theme", name);
  document.querySelectorAll(".theme-dot").forEach(d=>{
    d.classList.toggle("active", d.dataset.t === name);
  });
  saveState();
  renderCompanionLine();
}

document.querySelectorAll(".theme-dot").forEach(d=>{
  d.addEventListener("click", ()=> setTheme(d.dataset.t));
});

document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    document.getElementById("view-"+tab.dataset.view).classList.add("active");
  });
});

document.getElementById("refreshBtn").addEventListener("click", ()=>{
  drawDailyQuests();
  render();
  showToast("Nouvelle journée d'aventure");
});

/* =========================================================
   INIT
========================================================= */
function init(){
  setTheme(state.theme);
  if(state.drawDate !== todayStr()){
    drawDailyQuests();
  }
  render();
}

init();
</script>
</body>
</html>
